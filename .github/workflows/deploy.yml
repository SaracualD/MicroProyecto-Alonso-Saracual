name: Deploy Flutter Web to GitHub Pages

# Esto le dice a GitHub que ejecute este archivo cada vez que suban cambios a 'main'
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build Web
        # IMPORTANTE: Cambia "NOMBRE_DEL_REPO" por el nombre exacto de su repositorio en GitHub
        run: flutter build web --release --base-href /NOMBRE_DEL_REPO/
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web